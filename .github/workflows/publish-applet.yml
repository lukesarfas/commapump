# Publishes the CommaPump remote applet to GCS on every push that touches site/.
# Adapted from luke.sarfas.com/examples/publish-applet.template.yml.
#
# Required GitHub secret in this repo:
#   APPLETS_PUBLISHER_KEY    — JSON key of the applets-publisher service account
# Optional:
#   WEBSITE_DISPATCH_TOKEN   — PAT to trigger a hub rebuild after upload

name: Publish applet

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

env:
  APPLET_SLUG: "commapump"
  BUCKET: "luke-sarfas-applets"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build site + applet + manifest + preview
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.APPLETS_PUBLISHER_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate manifest + assets
        run: |
          test -f site/manifest.json || { echo "site/manifest.json missing"; exit 1; }
          test -f site/preview.png  || { echo "site/preview.png missing";  exit 1; }
          test -f site/applet/index.html || { echo "site/applet/index.html missing"; exit 1; }
          jq -e '.name and .slug and .applet and .preview' site/manifest.json > /dev/null

      - name: Upload to gs://$BUCKET/$APPLET_SLUG/
        run: |
          gcloud storage rsync site/ "gs://${BUCKET}/${APPLET_SLUG}/" \
            --recursive --delete-unmatched-destination-objects

      - name: Trigger hub rebuild
        if: ${{ secrets.WEBSITE_DISPATCH_TOKEN != '' }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/lukesarfas/luke.sarfas.com/dispatches \
            -d '{"event_type":"project-updated","client_payload":{"project":"'${APPLET_SLUG}'"}}'
