# Keep dependencies current for security hygiene (SPEC §5). Weekly npm updates
# and GitHub Actions pin bumps; grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps of the build/test toolchain (astro 5→6, vitest 2→4) are
    # breaking and intentionally pinned; the dev-only advisories they would
    # "fix" have no exploitable path in the static build (see SECURITY.md).
    # Take those by hand, not via an auto-PR that just turns CI red.
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
